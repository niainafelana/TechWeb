basePath: /api
definitions:
  models.Shoe:
    description: Shoe product information
    properties:
      created_at:
        example: "2023-06-01T15:04:05Z"
        type: string
      description:
        description: |-
          Description du produit
          Exemple: Classic sneaker with air cushioning
        example: Classic sneaker with air cushioning
        type: string
      id:
        type: integer
      images:
        description: Images associées à la chaussure
        items:
          $ref: '#/definitions/models.ShoeImage'
        type: array
      marque:
        description: |-
          Marque de la chaussure
          Exemple: Nike
        example: Nike
        type: string
      name:
        description: |-
          Nom du modèle
          Exemple: Air Max 90
        example: Air Max 90
        type: string
      price:
        description: |-
          Prix
          Exemple: 120.99
        example: 120.99
        type: number
      updated_at:
        example: "2023-06-01T15:04:05Z"
        type: string
    type: object
  models.ShoeImage:
    description: Image associée à un produit chaussure
    properties:
      created_at:
        example: "2023-06-01T15:04:05Z"
        type: string
      id:
        type: integer
      shoe_id:
        description: ID de la chaussure associée
        example: 1
        type: integer
      updated_at:
        example: "2023-06-01T15:04:05Z"
        type: string
      url:
        description: URL de l'image
        example: https://example.com/shoe.jpg
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: noums@hacker.com
    name: API Support
  description: API pour l'application SUN CO.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: SUN CO. API
  version: "1.0"
paths:
  /api/shoes:
    get:
      consumes:
      - application/json
      description: Obtenir la liste complète des chaussures disponibles
      produces:
      - application/json
      responses:
        "200":
          description: Liste des chaussures
          schema:
            items:
              $ref: '#/definitions/models.Shoe'
            type: array
        "500":
          description: Erreur serveur
          schema:
            type: object
      summary: Récupère toutes les chaussures
      tags:
      - Shoes
schemes:
- http
swagger: "2.0"
